<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다온닷컴 사전 정보 답변 확인</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" integrity="sha384-GIdEBaqGN9mNkDkMkzMHW8EKUqtpPIe/sLj1X7DIrnc9uPtLROJgmuDlh+3rBw0j" crossorigin="anonymous">
<style>
  :root{
    --navy:#124572;
    --ink:#121212;
    --muted:#5b6370;
    --line:#dfe4ea;
    --bg:#f3f5f8;
    --white:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif;
    font-size:15px; line-height:1.6; letter-spacing:-0.02em;
    -webkit-font-smoothing:antialiased; word-break:keep-all;
  }
  header{background:var(--navy); color:var(--white); height:56px; padding:0 20px 0 48px; display:flex; align-items:center; gap:12px}
  header img{width:26px; filter:brightness(0) invert(1)}
  header h1{margin:0; font-size:16px; font-weight:700}

  .btn{height:44px; padding:0 18px; border:0; border-radius:10px; background:var(--navy); color:var(--white); font:inherit; font-size:14px; font-weight:700; cursor:pointer}
  .gate{max-width:400px; margin:60px auto 0; background:var(--white); border:1px solid var(--line); border-radius:14px; padding:20px}
  .gate label{display:block; font-weight:700; margin-bottom:8px}
  .gate input{width:100%; height:52px; border:1px solid var(--line); border-radius:10px; padding:0 14px; font:inherit; font-size:16px}
  .gate input:focus{outline:none; border-color:var(--navy)}
  .gate .btn{width:100%; height:48px; margin-top:10px}
  .error{color:#c0392b; font-size:13px; margin:10px 0 0}
  .msg{text-align:center; color:var(--muted); padding:40px 0}

  /* 왼쪽 업체 목록 + 오른쪽 내용 */
  #app{display:grid; grid-template-columns:240px 1fr; min-height:calc(100vh - 56px)}
  aside{background:var(--white); border-right:1px solid var(--line); padding:16px 12px 16px 40px; position:sticky; top:0; height:calc(100vh - 56px); overflow-y:auto}
  aside input{width:100%; height:40px; border:1px solid var(--ink); border-radius:2px; padding:0 10px; font:inherit; font-size:15px; font-weight:600; text-align:center}
  aside input::placeholder{color:var(--ink)}
  aside input:focus{outline:none; border-color:var(--navy); box-shadow:0 0 0 2px rgba(18,69,114,.15)}
  #count{display:block; margin:10px 0 4px; color:var(--muted); font-size:13px}
  #companies{list-style:none; margin:0; padding:0}
  #companies button{
    display:block; width:100%; text-align:left; padding:4px 6px; border:0; border-radius:6px;
    background:none; color:var(--ink); font:inherit; font-size:15px; font-weight:700; cursor:pointer;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #companies button:hover{color:var(--navy); background:var(--bg)}
  #companies button.on{background:var(--navy); color:var(--white)}

  main{padding:16px 24px 60px}
  #detail{max-width:760px; margin:0 auto; background:var(--white); border-radius:14px; padding:12px 12px 24px}
  .detail-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding-bottom:10px; border-bottom:2px solid var(--navy)}
  .detail-head h2{margin:0; font-size:26px; letter-spacing:-0.03em; line-height:1.3}
  .detail-head p{margin:2px 0 0; color:var(--muted); font-size:12px}
  .detail-head .btn{flex:none}
  section{padding:18px 0; border-bottom:1px solid var(--line)}
  section:last-child{border-bottom:0; padding-bottom:0}
  section h3{margin:0 0 10px; font-size:17px; color:var(--navy)}
  dl{margin:0; display:grid; grid-template-columns:220px 1fr; gap:8px 16px}
  dt{color:var(--muted)}
  dd{margin:0; white-space:pre-wrap}
  dd.empty{color:var(--muted)}

  @media (max-width:720px){
    header{padding:0 16px}
    #app{grid-template-columns:1fr}
    aside{position:static; height:auto; max-height:40vh; padding:12px 16px; border-right:0; border-bottom:1px solid var(--line)}
    main{padding:12px}
    dl{grid-template-columns:1fr; gap:0}
    dd{margin-bottom:10px}
  }
</style>
</head>
<body>
<header>
  <img src="logo.svg" alt="다온닷컴">
  <h1>사전질문지 답변 확인</h1>
</header>

<div class="gate" id="gate" hidden>
  <label for="pw">비밀번호</label>
  <input type="password" id="pw" autocomplete="off">
  <button class="btn" id="enter">입장</button>
  <p class="error" id="gateError"></p>
</div>

<p class="msg" id="msg">불러오는 중...</p>

<div id="app" hidden>
  <aside>
    <input type="search" id="search" placeholder="업체명 검색하기" aria-label="업체명 검색">
    <span id="count"></span>
    <ul id="companies"></ul>
  </aside>
  <main>
    <div id="detail" hidden></div>
  </main>
</div>

<script>
(function(){
  // Code.gs 웹 앱 주소 (index.html 과 같은 배포)
  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwHJfkt-c1TrxOx1HABW4Xhv4j9DCZPRCLWF8GMNEXw27i6f1dwyOojpYzbD53XHrXm/exec';
  // daon_presurvey 와 같은 도메인이라 저장 이름을 따로 씀
  var KEY = 'daondotcomKey';
  var $ = function(id){ return document.getElementById(id); };
  var data = null, current = -1;

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; });
  }

  function showGate(err){
    $('msg').hidden = true;
    $('gate').hidden = false;
    $('gateError').textContent = err || '';
    $('pw').focus();
  }

  // 비밀번호는 이 브라우저에 기억 — 다음부터는 바로 목록이 보임
  function load(){
    var key = localStorage.getItem(KEY);
    if (!key) return showGate();
    $('gate').hidden = true;
    $('msg').hidden = false;
    $('msg').textContent = '불러오는 중...';
    fetch(WEBAPP_URL + '?key=' + encodeURIComponent(key))
      .then(function(r){ return r.json(); })
      .then(function(res){
        if (!res.ok) {
          if (res.error.indexOf('비밀번호') > -1) { localStorage.removeItem(KEY); return showGate(res.error); }
          $('msg').textContent = res.error;
          return;
        }
        data = res;
        $('msg').hidden = true;
        $('app').hidden = false;
        renderCompanies();
      })
      .catch(function(){ $('msg').textContent = '불러오지 못했습니다. 잠시 후 새로고침해주세요.'; });
  }

  // 업체명 가나다순, 검색어가 있으면 걸러서 표시
  function renderCompanies(){
    var rows = data.rows;
    var q = $('search').value.trim().toLowerCase();
    var seen = {};
    rows.forEach(function(r){ seen[r[1]] = (seen[r[1]] || 0) + 1; });
    var list = rows.map(function(r, i){
      var name = r[1] || '(업체명 없음)';
      // 같은 업체명이 여러 번 제출된 경우 제출일을 붙여 구분
      if (seen[r[1]] > 1) name += ' (' + r[0].slice(5, 10) + ')';
      return { i: i, name: name };
    }).filter(function(c){ return c.name.toLowerCase().indexOf(q) > -1; })
      .sort(function(a, b){ return a.name.localeCompare(b.name, 'ko'); });
    $('count').textContent = q ? list.length + ' / ' + rows.length + '곳' : rows.length + '곳';
    $('companies').innerHTML = list.length ? list.map(function(c){
      return '<li><button data-i="' + c.i + '" class="' + (c.i === current ? 'on' : '') + '" title="' + esc(c.name) + '">' + esc(c.name) + '</button></li>';
    }).join('') : '<li class="msg">' + (rows.length ? '검색 결과가 없습니다.' : '아직 답변이 없습니다.') + '</li>';
  }

  // 화면·메모장 공통: [섹션 제목, [[질문, 답변], ...]]
  function sectionsOf(row){
    var col = 1;
    return data.sections.map(function(s){
      return [s[0], s[1].map(function(label){ return [label, row[col++] || '']; })];
    });
  }

  function show(i){
    current = i;
    var row = data.rows[i];
    [].forEach.call($('companies').querySelectorAll('button'), function(b){ b.classList.toggle('on', +b.dataset.i === i); });
    $('detail').innerHTML =
      '<div class="detail-head"><div><h2>' + esc(row[1] || '(업체명 없음)') + '</h2><p>제출일시 ' + esc(row[0]) + '</p></div>' +
      '<button class="btn" id="download">메모장 다운로드</button></div>' +
      sectionsOf(row).map(function(s){
        return '<section><h3>' + esc(s[0]) + '</h3><dl>' + s[1].map(function(qa){
          return '<dt>' + esc(qa[0]) + '</dt>' + (qa[1] ? '<dd>' + esc(qa[1]) + '</dd>' : '<dd class="empty">—</dd>');
        }).join('') + '</dl></section>';
      }).join('');
    $('detail').hidden = false;
    window.scrollTo(0, 0);
  }

  function download(){
    var row = data.rows[current];
    var lines = ['제출일시: ' + row[0], ''];
    sectionsOf(row).forEach(function(s){
      lines.push(s[0]);
      s[1].forEach(function(qa){ lines.push('- ' + qa[0] + ': ' + qa[1]); });
      lines.push('', '');
    });
    // 윈도우 메모장용: BOM + CRLF
    var text = '﻿' + lines.join('\n').replace(/\r?\n/g, '\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
    a.download = '다온닷컴 사전정보 - ' + (row[1] || '업체명없음').replace(/[\\/:*?"<>|]/g, '_') + '.txt';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  $('search').addEventListener('input', renderCompanies);
  $('companies').addEventListener('click', function(e){
    var b = e.target.closest('button');
    if (b) show(+b.dataset.i);
  });
  $('detail').addEventListener('click', function(e){
    if (e.target.id === 'download') download();
  });
  $('enter').addEventListener('click', function(){
    var pw = $('pw').value.trim();
    if (!pw) return;
    localStorage.setItem(KEY, pw);
    load();
  });
  $('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('enter').click(); });

  load();
})();
</script>
</body>
</html>
